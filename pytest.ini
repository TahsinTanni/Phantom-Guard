[pytest]
# asyncio_mode = auto lets pytest-asyncio run any `async def test_*` function
# without needing @pytest.mark.asyncio on every single one. Only takes
# effect once pytest-asyncio is actually installed (`pip install
# pytest-asyncio`) — without it, async tests are skipped/fail with the
# "async def functions are not natively supported" message, which is an
# environment issue (missing plugin), not a code defect.
asyncio_mode = auto
